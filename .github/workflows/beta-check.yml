name: Beta JavaScript check

on:
  push:
    branches:
      - beta/yandex-mobile
  pull_request:
    branches:
      - beta/yandex-mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta
        uses: actions/checkout@v4

      - name: Check app.js
        run: node --check app.js

      - name: Check beta-overrides.js
        run: node --check beta-overrides.js

      - name: Check beta-card.js
        run: node --check beta-card.js

      - name: Check beta-device.js
        run: node --check beta-device.js

      - name: Check service worker
        run: node --check sw.js

      - name: Verify Beta wiring
        run: |
          grep -q "beta-overrides.js" index.html
          grep -q "beta-device.js" index.html
          grep -q "beta-card.js" beta-overrides.js
          grep -q "beta-card.js" sw.js
          grep -q "beta-device.js" sw.js
          grep -q "VOG Мобильный помощник Beta" index.html
          grep -q "vog-mobile-beta-" sw.js
          grep -q "popstate" beta-device.js
          grep -q "geolocation" beta-device.js

      - name: Build Yandex Object Storage package
        run: |
          mkdir -p dist
          cp index.html app.js styles.css sw.js manifest.webmanifest beta-overrides.js beta-card.js beta-device.js favicon-32.png icon-192.png icon-512.png icon-512-maskable.png dist/
          cat > dist/UPLOAD_TO_YANDEX.txt <<'EOF'
          VOG Мобильный помощник Beta 0.4

          Назначение: отдельный Beta-сайт в Yandex Object Storage.
          Загружать В СОДЕРЖИМОЕ отдельного Beta-bucket все файлы из этой папки, без внешней родительской папки.
          Стартовый документ статического сайта: index.html
          Рабочий сайт и ветку main не изменять.
          EOF
          (cd dist && zip -r ../VOG_MP_BETA_0_4_YANDEX_OBJECT_STORAGE.zip .)

      - name: Upload Beta package
        uses: actions/upload-artifact@v4
        with:
          name: VOG_MP_BETA_0_4_YANDEX_OBJECT_STORAGE
          path: VOG_MP_BETA_0_4_YANDEX_OBJECT_STORAGE.zip
          if-no-files-found: error
          retention-days: 30
